apiVersion: apps/v1
kind: Deployment
metadata:
  name: harbor-hospital
  labels:
    app: harbor-hospital
spec:
  replicas: 2
  selector:
    matchLabels:
      app: harbor-hospital
  template:
    metadata:
      labels:
        app: harbor-hospital
    spec:
      containers:
        - name: harbor-hospital
          image: image-registry.openshift-image-registry.svc:5000/jamesmensah12-dev/harbor-hospital:latest
          imagePullPolicy: Always
          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          ports:
            - containerPort: 8080